---
- name: Installation of Nginx
  hosts: web
  become: true

  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start nginx
      service:
        name: nginx
        state: started
        enabled: true

    - name: Update Landing Page
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>TPSecCloudAI - Walid</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
              }

              body {
                min-height: 100vh;
                background: linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
              }

              .card {
                width: 90%;
                max-width: 900px;
                padding: 50px;
                border-radius: 25px;
                background: rgba(255, 255, 255, 0.12);
                backdrop-filter: blur(14px);
                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
                text-align: center;
                border: 1px solid rgba(255, 255, 255, 0.25);
              }

              .badge {
                display: inline-block;
                padding: 10px 20px;
                border-radius: 999px;
                background: rgba(34, 197, 94, 0.2);
                color: #86efac;
                font-weight: bold;
                margin-bottom: 25px;
                border: 1px solid rgba(134, 239, 172, 0.4);
              }

              h1 {
                font-size: 3rem;
                margin-bottom: 20px;
                background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }

              p {
                font-size: 1.2rem;
                line-height: 1.7;
                color: #e5e7eb;
                margin-bottom: 30px;
              }

              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 20px;
                margin-top: 35px;
              }

              .item {
                padding: 20px;
                border-radius: 18px;
                background: rgba(15, 23, 42, 0.55);
                border: 1px solid rgba(255, 255, 255, 0.15);
              }

              .item h3 {
                color: #38bdf8;
                margin-bottom: 10px;
              }

              .footer {
                margin-top: 35px;
                font-size: 0.95rem;
                color: #cbd5e1;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="badge">Déploiement réussi avec Ansible</div>
              <h1>Bienvenue sur TPSecCloudAI</h1>
              <p>
                Cette page a été déployée automatiquement sur une instance AWS EC2
                avec Terraform, Ansible et Nginx.
              </p>

              <div class="grid">
                <div class="item">
                  <h3>Terraform</h3>
                  <span>Provisioning Cloud</span>
                </div>
                <div class="item">
                  <h3>Ansible</h3>
                  <span>Configuration automatique</span>
                </div>
                <div class="item">
                  <h3>Nginx</h3>
                  <span>Serveur Web actif</span>
                </div>
              </div>

              <div class="footer">
                Projet réalisé par Walid Houbabi
              </div>
            </div>
          </body>
          </html>