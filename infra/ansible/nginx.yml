---
- name: Installation of Engine-X
  hosts: web
  become: true
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
    - name: start nginx
      service:
        name: nginx
        state: started
        enabled: yes
    - name: Update Landing Page
      copy:
        content: "<h1>Welcome to TPSecCloudAI</h1>"
        dest: /var/www/html/index.html