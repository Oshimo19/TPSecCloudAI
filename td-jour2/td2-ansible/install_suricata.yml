---
- name: Deploiement et configuration de Suricata
  hosts: sonde
  become: true

  tasks:
    - name: Ajouter le depot officiel Suricata (OISF)
      ansible.builtin.apt_repository:
        repo: ppa:oisf/suricata-stable
        state: present

    - name: Mettre a jour le cache apt et installer Suricata
      ansible.builtin.apt:
        name: suricata
        state: present
        update_cache: true

    - name: Mettre a jour les regles Suricata (suricata-update)
      ansible.builtin.command: suricata-update
      changed_when: true

    - name: Ajouter une regle de detection ICMP personnalisee
      ansible.builtin.lineinfile:
        path: /var/lib/suricata/rules/suricata.rules
        line: >-
          alert icmp any any -> $HOME_NET any
          (msg:"TD2 ICMP detecte"; sid:1000001; rev:1;)
        state: present

    - name: Activer et redemarrer Suricata
      ansible.builtin.systemd:
        name: suricata
        enabled: true
        state: restarted
